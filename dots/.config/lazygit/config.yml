customCommands:
  # Worktrees go through ~/.local/bin/git-wt: always in <main repo>/.worktrees/,
  # with the icon4py setup (testdata/pyrightconfig links, uv sync) done.

  # Worktree for a local branch (select a branch and press W)
  - key: "W"
    context: "localBranches"
    description: "Worktree for branch"
    command: "git wt add {{ .SelectedLocalBranch.Name | quote }}"
    loadingText: "Creating worktree..."

  # Worktree from a branch name (press W anywhere). "owner:branch" (GitHub's
  # PR head label) tracks the owner's fork via remote "fork-<owner>".
  - key: "W"
    context: "global"
    description: "Worktree from branch name"
    prompts:
      - type: "input"
        title: "Branch name? (or owner:branch for a fork)"
        key: "Name"
        initialValue: ""
    command: "git wt add {{ .Form.Name | quote }}"
    loadingText: "Creating worktree..."

  # New or existing branch in a new worktree (press N anywhere), see git wt new.
  # In a terminal for its questions. Inside nvim ($NVIM), nvim switches there
  # too and reopens lazygit in it (lazygit_created in config/worktree.lua).
  - key: "N"
    context: "global"
    description: "New or existing branch in worktree"
    prompts:
      - type: "input"
        title: "Branch name (new, existing or owner:branch)"
        key: "Name"
        initialValue: ""
    command: >-
      git wt new {{ .Form.Name | quote }} &&
      if [ -n "$NVIM" ]; then
      nvim --server "$NVIM" --remote-expr
      "v:lua.require'config.worktree'.lazygit_created('$PWD', '{{ .Form.Name }}')"
      >/dev/null; fi
    output: terminal

  # Force remove a worktree
  - key: "D"
    context: "worktrees"
    description: "Force remove worktree"
    prompts:
      - type: "confirm"
        title: "Force Remove Worktree"
        body: "Are you sure you want to remove this worktree?"
    command: "git worktree remove -f {{ .SelectedWorktree.Path | quote }}"
    loadingText: "Removing worktree..."
